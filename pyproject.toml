[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "sports_betting"
description = "Python sports betting toolbox."
authors = [{name = "Georgios Douzas", email = "gdouzas@icloud.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11, <3.14"
keywords = []
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.0",
    "cloudpickle>=2.0.0",
    "beautifulsoup4>=4.0.0",
    "click>=8.1.3",
    "rich>=13.3.3",
    "aiohttp>=3.8.4",
    "pandera[pandas]>=0.27.0",
    "pyarrow>=17.0.0",
    "joblib>=1.5.0",
    "multidict>=6.0.0",
    "yarl>=1.9.0",
]

[project.urls]
Homepage = "https://georgedouzas.github.io/sports-betting"
Documentation = "https://georgedouzas.github.io/sports-betting"
Changelog = "https://georgedouzas.github.io/sports-betting/changelog"
Repository = "https://github.com/georgedouzas/sports-betting"
Issues = "https://github.com/georgedouzas/sports-betting/issues"
Discussions = "https://github.com/georgedouzas/sports-betting/discussions"

[project.scripts]
sportsbet = "sportsbet.cli:main"
sportsbet-mcp = "sportsbet.mcp:run"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]
execution = [
    "playwright>=1.57",
]
[tool.pdm.version]
source = "scm"

[tool.pdm.build]
package-dir = "src"
editable-backend = "path"

[tool.pdm.scripts]
clean = "nox --error-on-external-run -R -s clean"
docs = "nox --error-on-external-run -R -s docs -- {args:serve}"
formatting = "nox --error-on-external-run -R -s formatting -- {args:all}"
checks = "nox --default-venv-backend uv --error-on-external-run -R -s checks -- {args:all}"
tests = "nox --default-venv-backend uv --error-on-external-run -R -s tests"
changelog = "nox --error-on-external-run -R -s changelog"
release = "nox --error-on-external-run -R -s release"

[tool.pdm.dev-dependencies]
maintenance = [
    "nox[uv]>=2024.4.15",
]
docs = [
    "properdocs>=1.6.7",
    "mkdocs-coverage>=1.1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material>=9.5.27",
    "mkdocs-gallery>=0.10.1",
    "mkdocs-section-index>=0.3.9",
    "mkdocstrings[python]>=0.25.1",
    "markdown-callouts>=0.4.0",
    "markdown-exec>=1.9.3",
    'pandas>=2.2.2',
    "plotly>=5.17.0",
    "pillow>=10.3.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.11.0",
    "mkdocs-click>=0.9.0",
]
formatting = [
    "black>=24.4.2",
    "docformatter>=1.7.5",
]
checks = [
    "ruff>=0.5.0",
    "pip-audit>=2.7.3",
    "bandit[toml]>=1.7.5",
    "mypy>=1.10.1",
    "types-markdown>=3.6.0.20240316",
    "types-toml>=0.10.8.20240310",
    "types-pytz",
    "bandit>=1.7.5",
    "mypy>=1.10.1",
    "interrogate>=1.7.0",
    "pydoclint>=0.9.1",
    "deptry>=0.25.1",
]
tests = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-xdist>=3.6.1",
]
changelog = [
    "git-changelog>=2.5.2",
]

[tool.black]
line-length = 120
extend-exclude = "(tests/fixtures|docs/generated)"
skip-string-normalization = true
target-version = ["py311"]

[tool.docformatter]
in-place = true
recursive = true
close-quotes-on-newline = true
wrap-descriptions = 120
wrap-summaries = 120

[tool.ruff]
extend-exclude = ["docs/generated"]
force-exclude = true
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["D202", "N806", "N803", "S101", "INP001", "Q000", "TRY002", "PLR0913", "PLR0917", "EXE001", "EXE002", "E741"]
select = ["C", "E", "F", "W", "B", "I", "D", "N", "UP", "YTT", "ANN", "S",
"BLE", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G",
"INP", "PIE", "T20", "PT", "Q", "RET501", "RET502", "RET503", "SIM",
"PTH", "PD", "PGH", "PL", "TRY", "RUF", "PLE", "PLR", "PLW", "TRY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"docs/examples/*" = ["ANN", "D", "B018"]
"docs/generated/*" = ["ANN", "D"]
"test_*" = ["ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true
# annotation-unchecked: test functions are intentionally untyped, so notes about their bodies are noise.
disable_error_code = ["annotation-unchecked"]
exclude = ["tests/fixtures/", "docs/examples/", "docs/generated/"]
warn_unused_ignores = true
show_error_codes = true

[tool.pydoclint]
# Verifies docstrings match the signature, which interrogate cannot: interrogate counts
# docstrings, this one reads them.
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# The fitted attributes are documented under Attributes, as scikit-learn documents them, which pydoclint reads as
# class attributes.
check-class-attributes = false
# A Raises section names what a public call raises, including from the helpers it calls, which pydoclint cannot see.
skip-checking-raises = true

[tool.deptry.per_rule_ignores]
# pandas loads pyarrow for the `string[pyarrow]` dtype, so it is used without being imported.
DEP002 = ["pyarrow"]

[tool.bandit]
# Read by the checks nox session, which passes `-c pyproject.toml`. B101 is the
# bandit counterpart of the ruff S101 ignore above: asserts are how tests assert.
skips = ["B101"]

[tool.pip-audit]
# Advisory IDs to ignore, read by the checks nox session. PYSEC-2022-42969 is a
# won't-fix ReDoS in py, pulled in transitively by interrogate.
ignore-vulns = ["PYSEC-2022-42969"]

[tool.pytest.ini_options]
addopts = ["--cov", "--doctest-modules", "--dist=loadgroup", "-m", "not network"]
testpaths = ["src", "tests"]
markers = ["network: reads the live feed; deselected by default, run with `-m network`"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src", "tests"]

[tool.coverage.paths]
equivalent = ["src", "__pypackages__"]

[tool.coverage.report]
precision = 2
omit = ["src/*/__init__.py", "tests/__init__.py"]

[tool.coverage.json]
output = "htmlcov/coverage.json"
